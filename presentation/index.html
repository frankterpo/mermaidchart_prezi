	<style>
		/* Cursor-inspired Theme Overrides */
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

		:root {
			--r-background-color: #0c0c0c;
			/* Deep black/grey */
			--r-main-font: 'Inter', sans-serif;
			--r-heading-font: 'Inter', sans-serif;
			--r-main-color: #e0e0e0;
			--r-heading-color: #ffffff;
			--r-link-color: #a8a8ff;
			/* Soft purple/blue */
			--r-link-color-hover: #ffffff;
			--r-selection-background-color: #333;
		}

		.reveal {
			background: var(--r-background-color) !important;
		}

		html,
		body {
			background: var(--r-background-color) !important;
		}

		.reveal h1,
		.reveal h2,
		.reveal h3,
		.reveal h4,
		.reveal h5,
		.reveal h6 {
			text-transform: none;
			/* Cursor uses standard casing */
			font-weight: 600;
			letter-spacing: -0.02em;
		}

		.reveal h1 {
			background: linear-gradient(120deg, #fff, #888);
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.container {
			display: flex;
		}

		.col {
			flex: 1;
		}

		/* Match controls and progress bar to font color */
		.reveal .controls {
			color: var(--r-main-color) !important;
		}

		.reveal .progress span {
			background-color: var(--r-main-color) !important;
		}

		/* Mermaid container constraints */
		.mermaid {
			display: block;
			/* Flex can sometimes shrink content weirdly */
			text-align: center;
			background: transparent;
			width: 100%;
			overflow-x: auto !important;
			/* Permit horizontal scrolling for wide charts */
			padding-bottom: 20px;
			/* Space for scrollbar */
		}

		/* Override mermaid text for visibility and layout */
		.mermaid svg {
			font-family: 'Inter', sans-serif !important;
			height: auto !important;
			width: auto !important;
			/* Let it be as wide as it needs */
			max-width: none !important;
			/* Stop crushing wide charts */
			max-height: none !important;
		}

		/* Fix squished text: Reveal.js styles might be clashing. Force comfortable spacing. */
		.mermaid svg * {
			line-height: 1.5 !important;
		}

		/* Specific fix for foreignObject divs (HTML labels) */
		/* We target the foreignObject itself AND the div inside it to stop masking */
		.mermaid foreignObject,
		.mermaid foreignObject div {
			line-height: 1.5 !important;
			padding: 4px;
			/* Give it some breathing room */
			height: auto !important;
			/* Ensure it grows */
			overflow: visible !important;
			/* STOP THE MASKING */
		}

		/* Sometimes the label container in Mermaid also needs this */
		.mermaid .label {
			overflow: visible !important;
		}

		/* Ensure the SVG itself doesn't clip */
		.mermaid svg {
			overflow: visible !important;
		}

		/* SCORCHED EARTH ISOLATION: Hide EVERYTHING except the present slide. */
		.reveal.hide-others .slides section {
			display: none !important;
		}

		/* Show the present slide and its parent stacks */
		.reveal.hide-others .slides section.present {
			display: block !important;
		}

		/* Inside a stack, ONLY show the present slide and hide all immediate parent content */
		.reveal.hide-others .slides section.stack.present>*:not(section) {
			display: none !important;
		}

		.reveal.hide-others .slides section.stack.present section:not(.present) {
			display: none !important;
		}

		.reveal .slides section.present {
			background: var(--r-background-color) !important;
		}

		/* Utility Classes for Markdown attributes */

		/* Specific Table Fixes for Overflow */
		table.small-table,
		section[id*="task4"] table {
			font-size: 0.55em !important;
			line-height: 1.1 !important;
			table-layout: fixed !important;
			width: 100% !important;
			max-width: 1600px !important;
			box-sizing: border-box !important;
		}

		table.small-table td,
		section[id*="task4"] table td {
			word-break: break-all !important;
			overflow-wrap: anywhere !important;
			white-space: normal !important;
		}

		.text-left {
			text-align: left !important;
		}

		.text-center {
			text-align: center !important;
		}

		.full-width {
			width: 100% !important;
		}

		/* Subtle scrollbar for webkit */
		.reveal .slides section.present {
			overflow-y: auto !important;
			max-height: 100% !important;
		}

		.reveal .slides section::-webkit-scrollbar {
			width: 6px;
		}

		.reveal .slides section::-webkit-scrollbar-thumb {
			background: rgba(255, 255, 255, 0.1);

		}

		/* Spread tables out */
		.reveal table {

			font-size: 0.78em;
		}

		.reveal table th,

		.reveal ol,

			padding-left: 2em !important;
			box-sizing: border-box;
		}

		/* Scroll indicator fade at slide bottom */
		.reveal .slides>section.present.has-scroll::after,

			content: '▾ scroll';

			color: #555;
			pointer-events: none;
			animation: pulse-fade 2s ease-in-out infinite;

		@keyframes pulse-fade {

				opacity: 0.3;
			}

				opacity: 0.9;
			}

			border: 1px solid rgba(255, 255, 255, 0.05);

			transform: scale(1.1);

		.minimap-cell.title-row {

		.minimap-cell.visited.title-row {

		.minimap-cell.hidden {

		.reveal .slides {

	<script>
		// Initialize Mermaid
		mermaid.initialize({
			startOnLoad: false,
			theme: 'dark',
			securityLevel: 'loose',
			fontFamily: 'Inter',
			// CRITICAL FIX: Inject CSS into the measurement sandbox so Mermaid
			// calculates the box size using the SAME line-height we use for display.
			themeCSS: `
                .node foreignObject, .node foreignObject div {
                    line-height: 1.5 !important;
                    font-family: 'Inter', sans-serif !important;
                    overflow: visible;
                }
            `,
			flowchart: {
				htmlLabels: true,
				useMaxWidth: false
			},
			sequence: {
				mirrorActors: false
			}
		});

		// "Rendering Checker" & Content Loader
		(async function loadContent() {
			try {
				const response = await fetch('white_circle_prezi.md');
				if (!response.ok) throw new Error(`Failed to load white_circle_prezi.md: ${response.statusText}`);

				let markdown = await response.text();

				// 1. Process Custom Image Syntax ::img{src="..."}
				// Regex explanation: match ::img{src="..."}, capture the url
				markdown = markdown.replace(/::img\{src="(.*?)"\}/g, (match, url) => {
					// Changed to inline-block with smaller height for "logo wall" look
					return `<img src="${url}" style="margin: 10px; display: inline-block; height: 60px; max-width: 200px; vertical-align: middle;">`;
				});

				// 3. Initialize Reveal with inline markdown
				const section = document.getElementById('markdown-section');
				// section.innerHTML = ...; // REMOVED: Do not set innerHTML directly, it conflicts with the template script
				section.innerHTML = ''; // Clear it to be safe

				section.removeAttribute('data-markdown'); // clear file path if any
				section.setAttribute('data-markdown', ''); // enable inline parsing

				// Create the script template required for inline markdown
				const template = document.createElement('script');
				template.type = 'text/template';
				template.text = markdown; // Inject the processed markdown
				section.appendChild(template);

				// 4. Render Mermaid (Robust Post-Markdown hook)
				const renderAllMermaid = async () => {
					const blocks = document.querySelectorAll('.language-mermaid, code[class*="mermaid"]');
					if (blocks.length === 0) return;

					for (const block of blocks) {
						let toReplace = block;
						if (block.parentElement.tagName === 'PRE') toReplace = block.parentElement;
						if (toReplace.getAttribute('data-processed')) continue;

						const code = block.textContent.trim();
						try {
							window.mermaidCounter = (window.mermaidCounter || 0) + 1;
							const id = `mermaid-chart-${window.mermaidCounter}`;
							const { svg } = await mermaid.render(id, code);
							const div = document.createElement('div');
							div.className = 'mermaid';
							div.innerHTML = svg;
							toReplace.parentNode.replaceChild(div, toReplace);
							div.setAttribute('data-processed', 'true');
						} catch (e) {
							console.error("Mermaid Render Fail:", e);
						}
					}
				};

				// We set listeners BEFORE initialization to catch all events
				Reveal.on('ready', () => {
					renderAllMermaid();
					setTimeout(renderAllMermaid, 1000);
					initContactSwitcher();
					initIncidentLinkedinSwitcher();
				});
				Reveal.on('slidechanged', () => { renderAllMermaid(); initContactSwitcher(); initIncidentLinkedinSwitcher(); });

				async function initContactSwitcher() {
					const root = document.getElementById('tome-contact-switcher');
					if (!root) return;
					const contactsEl = root.querySelector('.folder-contacts');
					const emailEl = root.querySelector('.folder-email');
					if (!contactsEl || !emailEl) return;
					let data = null;
					try {
						const r = await fetch('tome_contacts.json?t=' + Date.now());
						if (r.ok) data = await r.json();
					} catch (_) {}
					if (!data) {
						const embedEl = document.getElementById('tome-contacts-embed');
						if (embedEl && embedEl.textContent) {
							try { data = JSON.parse(embedEl.textContent); } catch (_) {}
						}
					}
					const contacts = (data && data.contacts) ? data.contacts : [];
					const esc = (value) => String(value || '')
						.replace(/&/g, '&amp;')
						.replace(/</g, '&lt;')
						.replace(/>/g, '&gt;')
						.replace(/"/g, '&quot;')
						.replace(/'/g, '&#39;');
					const renderContact = (contact) => {
						const emailBody = contact?.email_body || '';
						const linkedinBody = contact?.linkedin_message || 'No LinkedIn message generated for this contact.';
						const reasons = Array.isArray(contact?.outreach_reason) ? contact.outreach_reason.slice(0, 3) : [];
						const reasonHtml = reasons.length
							? `<div class="msg-meta"><strong>Why this outreach:</strong><br>${reasons.map(r => `• ${esc(r)}`).join('<br>')}</div>`
							: '';
						const opencodeBadge = contact?.opencode?.used
							? ` <span class="pill-opencode" title="OpenCode ${contact.opencode.model || 'LLM'}">LLM</span>`
							: '';

						let warmIntroHtml = '';
						const warmIntro = contact?.warm_intro;
						const mutuals = contact?.mutuals;
						if (warmIntro && typeof warmIntro === 'object') {
							const entries = Object.entries(warmIntro);
							const introBlocks = entries.map(([key, msg]) => {
								const label = key.replace(/^via_/, '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
								return `<div style="margin-bottom:8px;"><div class="msg-title" style="font-size:0.85em;">🤝 Warm Intro via ${esc(label)}</div><pre>${esc(msg)}</pre></div>`;
							}).join('');
							warmIntroHtml = `<div style="border:1px solid #3a6; border-radius:6px; padding:10px; background:#0a1a0f;">${introBlocks}</div>`;
						} else if (mutuals && Array.isArray(mutuals.connections) && mutuals.connections.length === 0) {
							warmIntroHtml = `<div class="msg-meta" style="color:#888;">No mutual connections — cold outreach only.</div>`;
						} else if (mutuals && typeof mutuals.connections === 'string' && mutuals.connections.includes('No')) {
							warmIntroHtml = `<div class="msg-meta" style="color:#888;">No mutual connections — cold outreach only.</div>`;
						}

						let mutualsHtml = '';
						if (mutuals) {
							const conns = Array.isArray(mutuals.connections) ? mutuals.connections : [];
							if (conns.length > 0) {
								mutualsHtml = `<div class="msg-meta"><strong>🔗 Mutual connections:</strong><br>${conns.map(c => `• ${esc(c)}`).join('<br>')}<br><em>Approach: ${esc(mutuals.approach || '')}</em></div>`;
							}
						}

						emailEl.innerHTML = `
							<div class="folder-email-scroll">
								<div>
									<div class="msg-title">Email${opencodeBadge}</div>
									<pre>${esc(emailBody)}</pre>
								</div>
								<div>
									<div class="msg-title">LinkedIn</div>
									<pre>${esc(linkedinBody)}</pre>
								</div>
								${warmIntroHtml}
								${mutualsHtml}
								${reasonHtml}
							</div>
						`;
					};
					contactsEl.innerHTML = '';
					renderContact(contacts[0] || {});
					const parseLabel = (label) => {
						const s = String(label || '').trim();
						const sep = s.indexOf(', ');
						if (sep >= 0) return { name: s.slice(0, sep), position: s.slice(sep + 2) };
						return { name: s, position: '' };
					};
					contacts.forEach((c, i) => {
						const item = document.createElement('div');
						item.className = 'contact-item' + (i === 0 ? ' active' : '');
						item.dataset.index = String(i);
						const { name, position } = parseLabel(c.label);
						item.innerHTML = (c?.opencode?.used ? '<span class="tab-llm" title="LLM personalized"></span>' : '') +
							'<span class="contact-name">' + esc(name || 'Contact') + '</span>' +
							(position ? '<span class="contact-position">' + esc(position) + '</span>' : '');
						item.onclick = () => {
							contactsEl.querySelectorAll('.contact-item').forEach(t => t.classList.remove('active'));
							item.classList.add('active');
							renderContact(c);
						};
						contactsEl.appendChild(item);
					});
					if (contacts.length === 0) {
						renderContact({
							email_body: 'Subject: Tome + White Circle (Lakera stack check)\n\nHi Tome team,\n\nWe\'re reaching out because Specter client-link data shows Tome connected to Lakera\'s stack.\n\nWhite Circle is complementary: edge enforcement under 200ms, auto-patching for emerging vulnerabilities, and audit-ready runtime traces.\n\nIf helpful, we can run a short gap check against Tome\'s current posture and send concrete fix opportunities.\n\nBest,\nWhite Circle GTM',
							linkedin_message: 'Hi Tome team — we saw your Lakera-linked footprint and can share a quick edge enforcement + auto-patching gap checklist if useful.',
							outreach_reason: ['Specter linkage: Lakera AI (lakera.ai) appears connected to tome.com', 'Outreach driven by stack/competitor signal']
						});
						contactsEl.innerHTML = '<div class="contact-item active"><span class="contact-name">Tome team</span></div>';
					}
				}

				async function initIncidentLinkedinSwitcher() {
					const root = document.getElementById('incident-linkedin-switcher');
					if (!root) return;
					const contactsEl = root.querySelector('.folder-contacts');
					const emailEl = root.querySelector('.folder-email');
					if (!contactsEl || !emailEl) return;
					let data = null;
					try {
						const r = await fetch('incident_linkedin_contacts.json?t=' + Date.now());
						if (r.ok) data = await r.json();
					} catch (_) {}
					const contacts = (data && data.contacts) ? data.contacts : [];
					const esc = (value) => String(value || '')
						.replace(/&/g, '&amp;')
						.replace(/</g, '&lt;')
						.replace(/>/g, '&gt;')
						.replace(/"/g, '&quot;')
						.replace(/'/g, '&#39;');
					const renderContact = (contact) => {
						const incident = contact?.incident || '';
						const incidentUrl = contact?.incident_url || '';
						const linkedinBody = contact?.linkedin_message || 'No LinkedIn message.';
						const reasons = Array.isArray(contact?.outreach_reason) ? contact.outreach_reason.slice(0, 3) : [];
						const reasonHtml = reasons.length
							? `<div class="msg-meta"><strong>Why this outreach:</strong><br>${reasons.map(r => `• ${esc(r)}`).join('<br>')}</div>`
							: '';
						const incidentHtml = incident
							? `<div class="msg-title">Incident</div><div class="incident-callout">${esc(incident)}${incidentUrl ? ` <a href="${esc(incidentUrl)}" target="_blank" rel="noopener">Source</a>` : ''}</div>`
							: '';
						const linkedinUrl = contact?.linkedin_url || '';
						const linkHtml = linkedinUrl ? `<a href="${esc(linkedinUrl)}" target="_blank" class="pill">LinkedIn</a>` : '';
						emailEl.innerHTML = `
							<div class="folder-email-scroll">
								${incidentHtml ? `<div>${incidentHtml}</div>` : ''}
								<div>
									<div class="msg-title">LinkedIn Message</div>
									<pre>${esc(linkedinBody)}</pre>
								</div>
								${reasonHtml}
								${linkHtml ? `<div style="margin-top:8px;">${linkHtml}</div>` : ''}
							</div>
						`;
					};
					contactsEl.innerHTML = '';
					renderContact(contacts[0] || {});
					const parseLabel = (label) => {
						const s = String(label || '').trim();
						const sep = s.indexOf(', ');
						if (sep >= 0) return { name: s.slice(0, sep), position: s.slice(sep + 2) };
						return { name: s, position: '' };
					};
					contacts.forEach((c, i) => {
						const item = document.createElement('div');
						item.className = 'contact-item' + (i === 0 ? ' active' : '');
						item.dataset.index = String(i);
						const { name, position } = parseLabel(c.label);
						item.innerHTML = '<span class="contact-name">' + esc(name || c.label || 'Contact') + '</span>' +
							(position ? '<span class="contact-position">' + esc(position) + '</span>' : '');
						item.onclick = () => {
							contactsEl.querySelectorAll('.contact-item').forEach(t => t.classList.remove('active'));
							item.classList.add('active');
							renderContact(c);
						};
						contactsEl.appendChild(item);
					});
					if (contacts.length === 0) {
						renderContact({
							incident: 'No incident contacts loaded.',
							linkedin_message: 'Run: python -m src.cli outbound enrich-incident-linkedin (when available)',
							outreach_reason: []
						});
						contactsEl.innerHTML = '<div class="contact-item active"><span class="contact-name">No contacts</span></div>';
					}
				}

				await Reveal.initialize({
					hash: true,
					transition: 'slide',
					backgroundTransition: 'slide',
					width: 1600,
					height: 900,
					margin: 0.02,
					minScale: 0.2,
					maxScale: 2.0,
					plugins: [RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX]
				});

				// Scroll indicator: mark slides that overflow with .has-scroll class
				const updateScrollIndicator = () => {
					const slide = Reveal.getCurrentSlide();
					if (!slide) return;
					// Check after a brief RAF to let content render
					requestAnimationFrame(() => {
						if (slide.scrollHeight > slide.clientHeight + 10) {
							slide.classList.add('has-scroll');
							// Remove indicator once user has scrolled
							slide.addEventListener('scroll', () => {
								slide.classList.remove('has-scroll');
							}, { once: true });
						} else {
							slide.classList.remove('has-scroll');
						}
					});
				};
				Reveal.on('ready', updateScrollIndicator);
				Reveal.on('slidechanged', updateScrollIndicator);

				// 5. Zelda Minimap Logic
				const initMinimap = () => {
					const grid = document.getElementById('minimap-grid');
					const horizontalSlides = Reveal.getHorizontalSlides();
					const totalCols = horizontalSlides.length;

					// Find the maximum vertical depth and total slide count (h + all v)
					let maxRows = 0;
					const structure = horizontalSlides.map((hSlide) => {
						const vSlides = hSlide.querySelectorAll('section');
						const rowCount = vSlides.length || 1;
						if (rowCount > maxRows) maxRows = rowCount;
						return rowCount;
					});

					// Total slides = sum of all vertical stacks (each h-section has structure[h] slides)
					const totalSlides = structure.reduce((a, b) => a + b, 0);

					grid.style.display = 'grid';
					grid.style.gridTemplateColumns = `repeat(${totalCols}, 1fr)`;
					grid.innerHTML = '';

					const cells = [];
					for (let v = 0; v < maxRows; v++) {
						for (let h = 0; h < totalCols; h++) {
							const cell = document.createElement('div');
							cell.className = 'minimap-cell';
							if (v === 0) cell.classList.add('title-row');

							const vCount = structure[h];
							if (v >= vCount) {
								cell.classList.add('hidden');
							}
							grid.appendChild(cell);
							cells.push({ h, v, el: cell });
						}
					}

					const visited = new Set();

					const updateMinimap = () => {
						const indices = Reveal.getIndices();
						const currentKey = `${indices.h}-${indices.v}`;
						visited.add(currentKey);

						cells.forEach(c => {
							c.el.classList.remove('current');
							const key = `${c.h}-${c.v}`;
							if (visited.has(key)) {
								c.el.classList.add('visited');
							}
							if (c.h === indices.h && c.v === indices.v) {
								c.el.classList.add('current');
							}
						});
					};

					const updateProgress = () => {
						const visitedCount = visited.size;
						const percent = totalSlides > 0 ? Math.round((visitedCount / totalSlides) * 100) : 0;
						const el = document.getElementById('minimap-progress-text');
						if (el) el.textContent = `${percent}%`;
					};

					Reveal.on('slidechanged', updateMinimap);
					Reveal.on('ready', updateMinimap);
					updateMinimap();

					// Add minimize/maximize logic
					const container = document.getElementById('minimap-container');
					container.addEventListener('click', (e) => {
						e.stopPropagation();
						container.classList.toggle('minimized');
						updateProgress(); // Refresh percentage when toggling
					});

					Reveal.on('slidechanged', updateProgress);
					Reveal.on('ready', updateProgress);
					updateProgress();
				};

				Reveal.on('ready', initMinimap);
				if (Reveal.isReady()) initMinimap();

			} catch (err) {
				console.error("Presentation Error:", err);
				document.body.innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
                        <h1>Rendering Error</h1>
                        <p>Could not load or parse the presentation content.</p>
                        <pre>${err.message}</pre>
                    </div>`;
			}
		})();

		// Shared rendering function
		const renderOneChart = async (chart) => {
			// Now that we escaped upstream, textContent should contain the raw literal strings (including <br/>)
			let txt = chart.textContent.trim();
			if (!txt) return;

			try {
				window.mermaidCounter = (window.mermaidCounter || 0) + 1;
				const id = `mermaid-chart-${window.mermaidCounter}`;
				// Render returns an object { svg }
				const { svg } = await mermaid.render(id, txt);
				chart.innerHTML = svg;
				chart.setAttribute('data-processed', 'true');
			} catch (e) {
				console.error("Mermaid Render Fail:", e);
				chart.innerHTML = `<div style="color: #ff5f5f; font-size: 14px; border: 1px solid #ff5f5f; padding: 10px; text-align: left; background: rgba(0,0,0,0.5);">
                    <strong>Chart Failed:</strong><br/>
                    <pre style="white-space: pre-wrap;">${e.message}</pre>
                    <details><summary>Source</summary><pre>${txt}</pre></details>
                </div>`;
			}
		};
	</script>
</body>
