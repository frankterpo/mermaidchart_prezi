<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>White Circle - Growth Hacker Take-Home</title>
	<link rel="icon" href="https://pbs.twimg.com/profile_images/1619762936062386178/D6ZWxxXj_400x400.png">
	<!-- Placeholder Favicon -->

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reset.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/theme/black.css">

	<!-- Theme used for syntax highlighted code -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/highlight/monokai.css">

	<style>
		/* Cursor-inspired Theme Overrides */
		@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

		:root {
			--r-background-color: #0c0c0c;
			/* Deep black/grey */
			--r-main-font: 'Inter', sans-serif;
			--r-heading-font: 'Inter', sans-serif;
			--r-main-color: #e0e0e0;
			--r-heading-color: #ffffff;
			--r-link-color: #a8a8ff;
			/* Soft purple/blue */
			--r-link-color-hover: #ffffff;
			--r-selection-background-color: #333;
		}

		.reveal {
			background: radial-gradient(circle at top right, #1a1a1a 0%, #0c0c0c 40%);
		}

		.reveal h1,
		.reveal h2,
		.reveal h3,
		.reveal h4,
		.reveal h5,
		.reveal h6 {
			text-transform: none;
			/* Cursor uses standard casing */
			font-weight: 600;
			letter-spacing: -0.02em;
		}

		.reveal h1 {
			background: linear-gradient(120deg, #fff, #888);
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		.container {
			display: flex;
		}

		.col {
			flex: 1;
		}

		/* Match controls and progress bar to font color */
		.reveal .controls {
			color: var(--r-main-color) !important;
		}

		.reveal .progress span {
			background-color: var(--r-main-color) !important;
		}

		/* Mermaid container constraints */
		.mermaid {
			display: block;
			/* Flex can sometimes shrink content weirdly */
			text-align: center;
			background: transparent;
			width: 100%;
			overflow-x: auto !important;
			/* Permit horizontal scrolling for wide charts */
			padding-bottom: 20px;
			/* Space for scrollbar */
		}

		/* Override mermaid text for visibility and layout */
		.mermaid svg {
			font-family: 'Inter', sans-serif !important;
			height: auto !important;
			width: auto !important;
			/* Let it be as wide as it needs */
			max-width: none !important;
			/* Stop crushing wide charts */
			max-height: none !important;
		}

		/* Fix squished text: Reveal.js styles might be clashing. Force comfortable spacing. */
		.mermaid svg * {
			line-height: 1.5 !important;
		}

		/* Specific fix for foreignObject divs (HTML labels) */
		/* We target the foreignObject itself AND the div inside it to stop masking */
		.mermaid foreignObject,
		.mermaid foreignObject div {
			line-height: 1.5 !important;
			padding: 4px;
			/* Give it some breathing room */
			height: auto !important;
			/* Ensure it grows */
			overflow: visible !important;
			/* STOP THE MASKING */
		}

		/* Sometimes the label container in Mermaid also needs this */
		.mermaid .label {
			overflow: visible !important;
		}

		/* Ensure the SVG itself doesn't clip */
		.mermaid svg {
			overflow: visible !important;
		}

		/* DEFINITIVE FIX: Absolute isolation via display:none for non-present slides.
		   We only do this when the .hide-others class is present on the reveal container
		   to avoid interfering with initial layout/fragments. */
		.reveal.hide-others .slides section:not(.present) {
			display: none !important;
		}

		.reveal .slides section {
			background: var(--r-background-color) !important;
		}

		/* Utility Classes for Markdown attributes */

		/* Utility Classes for Markdown attributes */
		.small-table table {
			font-size: 0.65em !important;
			line-height: 1.2 !important;
		}

		.condensed-list ul,
		.condensed-list ol {
			font-size: 0.8em !important;
			line-height: 1.2 !important;
		}

		.mermaid-scaled .mermaid {
			transform: scale(0.8);
			transform-origin: top center;
		}

		.text-left {
			text-align: left !important;
		}

		.text-center {
			text-align: center !important;
		}

		.full-width {
			width: 100% !important;
		}

		/* Subtle scrollbar for webkit */
		.reveal .slides section::-webkit-scrollbar {
			width: 4px;
		}

		.reveal .slides section::-webkit-scrollbar-thumb {
			background: #444;
			border-radius: 2px;
		}

		/* Spread tables out */
		.reveal table {
			width: 100% !important;
			margin: 0 auto !important;
			font-size: 0.78em;
		}

		.reveal table th,
		.reveal table td {
			padding: 0.2em 0.5em !important;
		}

		/* Ensure list numbers/bullets aren't cut off by zero-margin layout */
		.reveal ol,
		.reveal ul {
			padding-left: 2em !important;
			box-sizing: border-box;
		}

		/* Scroll indicator fade at slide bottom */
		.reveal .slides>section.present.has-scroll::after,
		.reveal .slides>section>section.present.has-scroll::after {
			content: '▾ scroll';
			position: fixed;
			bottom: 40px;
			right: 70px;
			font-size: 0.55em;
			color: #555;
			pointer-events: none;
			animation: pulse-fade 2s ease-in-out infinite;
		}

		@keyframes pulse-fade {

			0%,
			100% {
				opacity: 0.3;
			}

			50% {
				opacity: 0.9;
			}
		}

		/* Zelda Minimap Overlays */
		#minimap-container {
			position: fixed;
			top: 20px;
			right: 20px;
			z-index: 100;
			pointer-events: none;
			padding: 8px;
			background: rgba(12, 12, 12, 0.7);
			backdrop-filter: blur(8px);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 4px;
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		.minimap-row {
			display: flex;
			gap: 4px;
		}

		.minimap-cell {
			width: 12px;
			height: 8px;
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.05);
			border-radius: 1px;
			transition: all 0.3s ease;
		}

		.minimap-cell.visited {
			background: rgba(168, 168, 255, 0.2);
			border-color: rgba(168, 168, 255, 0.4);
		}

		.minimap-cell.current {
			background: #a8a8ff;
			border-color: #fff;
			box-shadow: 0 0 8px rgba(168, 168, 255, 0.8);
			transform: scale(1.1);
		}

		/* Mark the top row as Title slides */
		.minimap-cell.title-row {
			border-bottom: 2px solid rgba(255, 255, 255, 0.3);
			height: 10px;
			/* Slightly taller for titles */
		}

		.minimap-cell.visited.title-row {
			border-bottom-color: rgba(168, 168, 255, 0.6);
		}

		.minimap-cell.hidden {
			opacity: 0;
			pointer-events: none;
		}

		#minimap-label-container {
			display: flex;
			flex-direction: column;
			align-items: flex-end;
			margin-bottom: 6px;
		}

		#minimap-label {
			font-size: 10px;
			font-weight: 700;
			text-transform: uppercase;
			color: #eee;
			letter-spacing: 0.1em;
			text-align: right;
			font-family: inherit;
		}

		#minimap-sublabel {
			font-size: 8px;
			color: #666;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			margin-top: 1px;
		}
	</style>
</head>

<body>
	<div class="reveal">
		<div class="slides">
			<!-- Content will be injected here by the script -->
			<section id="markdown-section" data-separator="^\r?\n-{3,}\r?\n$"
				data-separator-vertical="^\r?\n={3,}\r?\n$">
			</section>
		</div>
		<div id="minimap-container">
			<div id="minimap-label-container">
				<div id="minimap-label">Quest Map</div>
				<div id="minimap-sublabel">↓ Elaboration</div>
			</div>
			<div id="minimap-grid"></div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/dist/reveal.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/notes/notes.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/markdown/markdown.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.0.4/plugin/highlight/highlight.js"></script>
	<!-- Load Mermaid -->
	<script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

	<script>
		// Initialize Mermaid
		mermaid.initialize({
			startOnLoad: false,
			theme: 'dark',
			securityLevel: 'loose',
			fontFamily: 'Inter',
			// CRITICAL FIX: Inject CSS into the measurement sandbox so Mermaid
			// calculates the box size using the SAME line-height we use for display.
			themeCSS: `
                .node foreignObject, .node foreignObject div {
                    line-height: 1.5 !important;
                    font-family: 'Inter', sans-serif !important;
                    overflow: visible;
                }
            `,
			flowchart: {
				htmlLabels: true,
				useMaxWidth: false
			},
			sequence: {
				mirrorActors: false
			}
		});

		// "Rendering Checker" & Content Loader
		(async function loadContent() {
			try {
				const response = await fetch('white_circle_prezi.md');
				if (!response.ok) throw new Error(`Failed to load white_circle_prezi.md: ${response.statusText}`);

				let markdown = await response.text();

				// 1. Process Custom Image Syntax ::img{src="..."}
				// Regex explanation: match ::img{src="..."}, capture the url
				markdown = markdown.replace(/::img\{src="(.*?)"\}/g, (match, url) => {
					// Changed to inline-block with smaller height for "logo wall" look
					return `<img src="${url}" style="margin: 10px; display: inline-block; height: 60px; max-width: 200px; vertical-align: middle;">`;
				});

				// 3. Initialize Reveal with inline markdown
				const section = document.getElementById('markdown-section');
				// section.innerHTML = ...; // REMOVED: Do not set innerHTML directly, it conflicts with the template script
				section.innerHTML = ''; // Clear it to be safe

				section.removeAttribute('data-markdown'); // clear file path if any
				section.setAttribute('data-markdown', ''); // enable inline parsing

				// Create the script template required for inline markdown
				const template = document.createElement('script');
				template.type = 'text/template';
				template.text = markdown; // Inject the processed markdown
				section.appendChild(template);

				await Reveal.initialize({
					hash: true,
					transition: 'slide',
					backgroundTransition: 'slide',
					// Optimize layout for scrolling down, not sideways
					width: 1600,
					height: 900,
					margin: 0.15, // Increased from 0.1 to further prevent ghosting
					minScale: 0.2,
					maxScale: 2.0,
					plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
				});

				// 4. Render Mermaid (Robust Post-Markdown hook)
				const renderAllMermaid = async () => {
					const blocks = document.querySelectorAll('.language-mermaid, code[class*="mermaid"]');
					if (blocks.length === 0) return;

					for (const block of blocks) {
						let toReplace = block;
						if (block.parentElement.tagName === 'PRE') toReplace = block.parentElement;
						if (toReplace.getAttribute('data-processed')) continue;

						const code = block.textContent.trim();
						try {
							window.mermaidCounter = (window.mermaidCounter || 0) + 1;
							const id = `mermaid-chart-${window.mermaidCounter}`;
							const { svg } = await mermaid.render(id, code);
							const div = document.createElement('div');
							div.className = 'mermaid';
							div.innerHTML = svg;
							toReplace.parentNode.replaceChild(div, toReplace);
							div.setAttribute('data-processed', 'true');
						} catch (e) {
							console.error("Mermaid Render Fail:", e);
						}
					}
				};

				// We run it on ready and after a small delay to be safe
				Reveal.on('ready', () => {
					renderAllMermaid();
					setTimeout(renderAllMermaid, 1000);
					// Enable absolute isolation once ready
					document.querySelector('.reveal').classList.add('hide-others');
				});
				Reveal.on('slidechanged', renderAllMermaid);

				// Scroll indicator: mark slides that overflow with .has-scroll class
				const updateScrollIndicator = () => {
					const slide = Reveal.getCurrentSlide();
					if (!slide) return;
					// Check after a brief RAF to let content render
					requestAnimationFrame(() => {
						if (slide.scrollHeight > slide.clientHeight + 10) {
							slide.classList.add('has-scroll');
							// Remove indicator once user has scrolled
							slide.addEventListener('scroll', () => {
								slide.classList.remove('has-scroll');
							}, { once: true });
						} else {
							slide.classList.remove('has-scroll');
						}
					});
				};
				Reveal.on('ready', updateScrollIndicator);
				Reveal.on('slidechanged', updateScrollIndicator);

				// 5. Zelda Minimap Logic
				const initMinimap = () => {
					const grid = document.getElementById('minimap-grid');
					const horizontalSlides = Reveal.getHorizontalSlides();
					const totalCols = horizontalSlides.length;

					// Find the maximum vertical depth
					let maxRows = 0;
					const structure = horizontalSlides.map((hSlide, hIndex) => {
						const vSlides = hSlide.querySelectorAll('section');
						const rowCount = vSlides.length || 1;
						if (rowCount > maxRows) maxRows = rowCount;
						return rowCount;
					});

					grid.style.display = 'grid';
					grid.style.gridTemplateColumns = `repeat(${totalCols}, 1fr)`;
					grid.innerHTML = '';

					const cells = [];
					for (let v = 0; v < maxRows; v++) {
						for (let h = 0; h < totalCols; h++) {
							const cell = document.createElement('div');
							cell.className = 'minimap-cell';
							if (v === 0) cell.classList.add('title-row');

							const vCount = structure[h];
							if (v >= vCount) {
								cell.classList.add('hidden');
							}
							grid.appendChild(cell);
							cells.push({ h, v, el: cell });
						}
					}

					const visited = new Set();

					const updateMinimap = () => {
						const indices = Reveal.getIndices();
						const currentKey = `${indices.h}-${indices.v}`;
						visited.add(currentKey);

						cells.forEach(c => {
							c.el.classList.remove('current');
							const key = `${c.h}-${c.v}`;
							if (visited.has(key)) {
								c.el.classList.add('visited');
							}
							if (c.h === indices.h && c.v === indices.v) {
								c.el.classList.add('current');
							}
						});
					};

					Reveal.on('slidechanged', updateMinimap);
					Reveal.on('ready', updateMinimap);
					updateMinimap();
				};

				Reveal.on('ready', initMinimap);
				if (Reveal.isReady()) initMinimap();

			} catch (err) {
				console.error("Presentation Error:", err);
				document.body.innerHTML = `<div style="color: red; padding: 20px; font-family: sans-serif;">
                        <h1>Rendering Error</h1>
                        <p>Could not load or parse the presentation content.</p>
                        <pre>${err.message}</pre>
                    </div>`;
			}
		})();

		// Shared rendering function
		const renderOneChart = async (chart) => {
			// Now that we escaped upstream, textContent should contain the raw literal strings (including <br/>)
			let txt = chart.textContent.trim();
			if (!txt) return;

			try {
				window.mermaidCounter = (window.mermaidCounter || 0) + 1;
				const id = `mermaid-chart-${window.mermaidCounter}`;
				// Render returns an object { svg }
				const { svg } = await mermaid.render(id, txt);
				chart.innerHTML = svg;
				chart.setAttribute('data-processed', 'true');
			} catch (e) {
				console.error("Mermaid Render Fail:", e);
				chart.innerHTML = `<div style="color: #ff5f5f; font-size: 14px; border: 1px solid #ff5f5f; padding: 10px; text-align: left; background: rgba(0,0,0,0.5);">
                    <strong>Chart Failed:</strong><br/>
                    <pre style="white-space: pre-wrap;">${e.message}</pre>
                    <details><summary>Source</summary><pre>${txt}</pre></details>
                </div>`;
			}
		};
	</script>
</body>

</html>
